id: gold-s-shaped-leaf-on-red-repeat
title: Gold S-leaf on red, repeat tile
description: One cycle of the narrow red band of the miniature frame, a gold S-shaped leaf with a darker lobe painted on a dull red ground with gold speckling. The pattern continues across the left and right edges; the band's painted edges are slightly ragged and the thin strips above and below it are transparent.
