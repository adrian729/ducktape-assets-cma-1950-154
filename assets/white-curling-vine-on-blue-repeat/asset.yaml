# descriptive: find it and understand it
id: white-curling-vine-on-blue-repeat
title: White vine on blue, repeat tile
description: One cycle of the blue band of the miniature frame. A white, grey-shaded vine stem curls into a spiral at the left, throws a three-lobed leaf upward at the centre and a hooked tendril downward, on a deep blue ground with dark speckling. The pattern continues across the left and right edges; the thin strips above and below the painted band are transparent.
