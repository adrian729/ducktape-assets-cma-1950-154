# descriptive: find it and understand it
id: blue-vine-frame
title: Blue vine miniature frame
description: The painted frame of the miniature with its interior removed. A wide blue band carries a white curling vine with leaves and spiral tendrils, between a narrow outer and inner red band bearing a gold chain-like pattern, with a thin gold rule along the inside edge. Gold and red leaf finials spring outward from the two upper corners and blue, gold-edged leaf flourishes from the two lower corners. The frame is slightly trapezoidal as painted. Only the paint is opaque; the interior and everything outside the frame are transparent.
type: frame
