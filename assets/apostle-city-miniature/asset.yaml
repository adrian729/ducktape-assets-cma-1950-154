# descriptive: find it and understand it
id: apostle-city-miniature
title: Apostle before a walled city, framed miniature
description: The whole miniature from the leaf. A grey-haired, bearded apostle with a gold halo stands centred on a pale green ground facing the viewer, in a blue tunic and orange-brown mantle, right hand raised in speech and a rolled white scroll in his left. Pink and ochre city towers rise on either side with red cloth draped between them, on a burnished gold ground. A painted frame of a blue band with white curling vines between two narrow red and gold bands encloses the scene, with leaf flourishes at the four corners; it runs slightly askew. Opaque inside the frame, transparent outside.
