id: standing-apostle-with-rolled-scroll
title: Standing apostle with a scroll
description: A grey-haired, bearded apostle stands facing the viewer in a blue tunic and an orange-brown mantle with white highlights, draped over his left shoulder and wrapped around his body; his right hand is raised before his chest in a gesture of speech and his left holds a white rolled scroll. He wears sandals. His halo is kept as a thin gold ring with the gold ground inside it removed. Cut from the framed miniature of the leaf; the background is transparent.
