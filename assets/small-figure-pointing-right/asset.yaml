title: Haloed man in profile pointing right
description: A small bearded man with a gold halo stands in profile facing right, his right arm stretched out and pointing, in an olive-green tunic and a blue mantle wrapped around the lower body, on a small red and gold base. The paint is heavily flaked, with pale parchment showing through the halo, face and mantle. The background is transparent.
