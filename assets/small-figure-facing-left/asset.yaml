title: Haloed man facing left with open hand
description: A small bearded man with a red-rimmed gold halo stands turned to the left with his head bowed, his right hand held out open towards the left, in a blue tunic under an orange mantle with white highlights, on a small red and gold base. The paint is worn, with pale parchment showing through the halo and face. The background is transparent.
